<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미니게임 천국 - 지뢰찾기 (10x10)</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --cell-bg: #334155;
            --cell-hover: #475569;
            --cell-revealed: #0f172a;
            --border-color: #475569;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--accent-color);
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .game-container {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background-color: rgba(15, 23, 42, 0.6);
            padding: 12px 20px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .info-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .info-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-size: 1.3rem;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            color: #f43f5e;
        }

        .info-value.time {
            color: #38bdf8;
        }

        .reset-btn {
            background-color: var(--cell-bg);
            border: 1px solid var(--border-color);
            font-size: 1.5rem;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .reset-btn:hover {
            background-color: var(--cell-hover);
            transform: scale(1.05);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(10, 36px);
            grid-template-rows: repeat(10, 36px);
            gap: 4px;
            background-color: rgba(15, 23, 42, 0.8);
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            user-select: none;
        }

        .cell {
            width: 36px;
            height: 36px;
            background-color: var(--cell-bg);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background-color 0.15s ease, transform 0.1s ease;
        }

        .cell:hover:not(.revealed) {
            background-color: var(--cell-hover);
        }

        .cell.revealed {
            background-color: var(--cell-revealed);
            cursor: default;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .cell.flagged {
            color: #f43f5e;
        }

        .cell.mine {
            background-color: #ef4444;
            color: white;
        }

        /* 숫자별 색상 지정 */
        .cell[data-count="1"] { color: #60a5fa; }
        .cell[data-count="2"] { color: #4ade80; }
        .cell[data-count="3"] { color: #f87171; }
        .cell[data-count="4"] { color: #c084fc; }
        .cell[data-count="5"] { color: #fbbf24; }
        .cell[data-count="6"] { color: #2dd4bf; }
        .cell[data-count="7"] { color: #e879f9; }
        .cell[data-count="8"] { color: #f43f5e; }

        .instructions {
            margin-top: 15px;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.5;
        }

        .instructions span {
            display: inline-block;
            margin: 0 5px;
            padding: 2px 6px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-color);
        }
    </style>
</head>
<body>

    <header>
        <h1>🎮 미니게임 천국</h1>
        <p>클래식 지뢰찾기 (10 × 10)</p>
    </header>

    <div class="game-container">
        <div class="status-bar">
            <div class="info-box">
                <span class="info-label">지뢰</span>
                <span id="mine-count" class="info-value">10</span>
            </div>
            <button id="reset-btn" class="reset-btn" title="게임 리셋">😊</button>
            <div class="info-box">
                <span class="info-label">시간</span>
                <span id="timer" class="info-value time">000</span>
            </div>
        </div>

        <div id="board" class="board"></div>
    </div>

    <div class="instructions">
        <p><span>좌클릭</span> 칸 열기 &nbsp;|&nbsp; <span>우클릭</span> 깃발 표시 / 해제</p>
    </div>

    <script>
        const BOARD_SIZE = 10;
        const MINE_COUNT = 10;

        let board = [];
        let revealedCount = 0;
        let flagsCount = 0;
        let gameOver = false;
        let gameStarted = false;
        let timerInterval = null;
        let timeElapsed = 0;

        const boardElement = document.getElementById('board');
        const mineCountElement = document.getElementById('mine-count');
        const timerElement = document.getElementById('timer');
        const resetBtn = document.getElementById('reset-btn');

        // 게임 초기화
        function initGame() {
            // 타이머 정지 및 초기화
            clearInterval(timerInterval);
            timeElapsed = 0;
            timerElement.textContent = '000';
            gameStarted = false;
            gameOver = false;
            revealedCount = 0;
            flagsCount = 0;
            mineCountElement.textContent = MINE_COUNT;
            resetBtn.textContent = '😊';

            // 보드 구조 생성
            board = [];
            boardElement.innerHTML = '';

            for (let r = 0; r < BOARD_SIZE; r++) {
                let row = [];
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cellElement = document.createElement('div');
                    cellElement.classList.add('cell');
                    cellElement.dataset.row = r;
                    cellElement.dataset.col = c;

                    cellElement.addEventListener('click', () => handleCellClick(r, c));
                    cellElement.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        handleCellRightClick(r, c);
                    });

                    boardElement.appendChild(cellElement);

                    row.push({
                        element: cellElement,
                        isMine: false,
                        isRevealed: false,
                        isFlagged: false,
                        neighborMines: 0
                    });
                }
                board.push(row);
            }
        }

        // 지뢰 배치 (첫 번째 클릭된 위치 제외)
        function placeMines(exRow, exCol) {
            let placed = 0;
            while (placed < MINE_COUNT) {
                let r = Math.floor(Math.random() * BOARD_SIZE);
                let c = Math.floor(Math.random() * BOARD_SIZE);

                // 첫 클릭 칸과 주변 8칸에는 지뢰를 배치하지 않음 (첫 클릭 안전 보장)
                if (!board[r][c].isMine && !(Math.abs(r - exRow) <= 1 && Math.abs(c - exCol) <= 1)) {
                    board[r][c].isMine = true;
                    placed++;
                }
            }

            // 주변 지뢰 개수 계산
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (!board[r][c].isMine) {
                        board[r][c].neighborMines = countNeighborMines(r, c);
                    }
                }
            }
        }

        // 이웃 지뢰 수 세기
        function countNeighborMines(r, c) {
            let count = 0;
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    let nr = r + dr;
                    let nc = c + dc;
                    if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE) {
                        if (board[nr][nc].isMine) count++;
                    }
                }
            }
            return count;
        }

        // 타이머 시작
        function startTimer() {
            timerInterval = setInterval(() => {
                timeElapsed++;
                if (timeElapsed > 999) timeElapsed = 999;
                timerElement.textContent = String(timeElapsed).padStart(3, '0');
            }, 1000);
        }

        // 셀 클릭 핸들러
        function handleCellClick(r, c) {
            if (gameOver) return;
            const cell = board[r][c];
            if (cell.isRevealed || cell.isFlagged) return;

            // 첫 클릭 처리
            if (!gameStarted) {
                gameStarted = true;
                placeMines(r, c);
                startTimer();
            }

            // 지뢰 폭발
            if (cell.isMine) {
                endGame(false, r, c);
                return;
            }

            // 셀 열기
            revealCell(r, c);

            // 승리 체크
            if (revealedCount === BOARD_SIZE * BOARD_SIZE - MINE_COUNT) {
                endGame(true);
            }
        }

        // 셀 열기 (재귀적 빈 칸 펼치기)
        function revealCell(r, c) {
            const cell = board[r][c];
            if (cell.isRevealed || cell.isFlagged) return;

            cell.isRevealed = true;
            cell.element.classList.add('revealed');
            revealedCount++;

            if (cell.neighborMines > 0) {
                cell.element.textContent = cell.neighborMines;
                cell.element.dataset.count = cell.neighborMines;
            } else {
                // 주변 8칸 재귀적으로 오픈
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        let nr = r + dr;
                        let nc = c + dc;
                        if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE) {
                            revealCell(nr, nc);
                        }
                    }
                }
            }
        }

        // 우클릭 (깃발)
        function handleCellRightClick(r, c) {
            if (gameOver || !gameStarted && revealedCount === 0) return;
            const cell = board[r][c];
            if (cell.isRevealed) return;

            if (cell.isFlagged) {
                cell.isFlagged = false;
                cell.element.classList.remove('flagged');
                cell.element.textContent = '';
                flagsCount--;
            } else {
                cell.isFlagged = true;
                cell.element.classList.add('flagged');
                cell.element.textContent = '🚩';
                flagsCount++;
            }

            mineCountElement.textContent = MINE_COUNT - flagsCount;
        }

        // 게임 종료
        function endGame(isWin, hitRow = -1, hitCol = -1) {
            gameOver = true;
            clearInterval(timerInterval);

            if (isWin) {
                resetBtn.textContent = '😎';
                mineCountElement.textContent = '0';
                // remaining mines flag
                for (let r = 0; r < BOARD_SIZE; r++) {
                    for (let c = 0; c < BOARD_SIZE; c++) {
                        if (board[r][c].isMine && !board[r][c].isFlagged) {
                            board[r][c].element.textContent = '🚩';
                            board[r][c].element.classList.add('flagged');
                        }
                    }
                }
                setTimeout(() => alert(`🎉 축하합니다! ${timeElapsed}초 만에 성공하셨습니다!`), 100);
            } else {
                resetBtn.textContent = '😵';
                // 모든 지뢰 공개
                for (let r = 0; r < BOARD_SIZE; r++) {
                    for (let c = 0; c < BOARD_SIZE; c++) {
                        const cell = board[r][c];
                        if (cell.isMine) {
                            cell.element.classList.add('revealed', 'mine');
                            cell.element.textContent = '💣';
                        }
                    }
                }
            }
        }

        // 리셋 버튼 및 시작
        resetBtn.addEventListener('click', initGame);
        initGame();
    </script>
</body>
</html>
